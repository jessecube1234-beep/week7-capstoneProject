<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts DM Sans and Bricolage Grotesque-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@200..800&family=DM+Sans:ital,wght@0,100..1000;1,100..1000&display=swap" rel="stylesheet">
    <!-- CDN Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <title>Weather Now</title>
</head>

<body>

    <!-- UI Container-->
    <div class="container text-center py-5">

        <!-- Header -->
        <header class="container py-3 mb-5">
            <div class="d-flex justify-content-between align-items-center">

                <!-- Logo on the left -->
                <div>
                    <img src="./assets/images/logo.svg" alt="Logo" style="height: 42px;">
                </div>

                <!-- Dropdown on the right -->
                <div>
                    <select class="form-select w-auto" id="drop-down">
                        <option selected>Units</option>
                        <option value="metric">Metric</option>
                        <option value="imperial">Imperial</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Main -->
        <main>
            <h2 class="mb-5">How's the sky looking today?</h2>

            <!-- Search Form-->
            <form id="search-form" class="d-flex justify-content-center mb-5">
                <input id="city-input" type="text" class="form-control w-25 me-2 custom-placeholder"
                    placeholder="Search for a place..." required>
                <button class="btn btn-primary" type="submit">Search</button>
            </form>
            <!-- Current Conditions Card -->
            <div class="container mb-5">
                <div
                    class="card current-weather-card text-light rounded-5 p-4 d-flex flex-md-row align-items-center justify-content-between">

                    <!-- Left Side City and Date -->
                    <div class="text-start">
                        <h4 class="fw-semibold fs-1 mb-4" id="city-name">Berlin, Germany</h4>
                        <p class="mb-0" id="date">Tuesday, Aug 5, 2025</p>
                    </div>

                    <!-- Right Side Weather Icon and Temp -->
                    <div class="text-end d-flex align-items-center">
                        <img src="./assets/images/icon-sunny.webp" alt="Weather Icon" class="me-5"
                            style="height: 150px;">
                        <h1 class="mb-0" id="temp">20°</h1>
                    </div>

                </div>
            </div>

            <!-- Weather Metrics -->
            <div class="row g-4 mb-5 justify-content-center">
                <div class="col-6 col-md-3">
                    <div class="card rounded-4 p-3 text-start feels-like-card">
                        <h6 class="text-uppercase mb-5">Feels Like</h6>
                        <p class="fs-1 mb-0" id="feels-like">18°</p>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card rounded-4 p-3 text-start humidity-card">
                        <h6 class="text-uppercase mb-5">Humidity</h6>
                        <p class="fs-1 mb-0" id="humidity">46%</p>
                    </div>
                </div>
                <div class="col-6 col-md-3 rounded-5">
                    <div class="card rounded-4 p-3 text-start wind-card">
                        <h6 class="text-uppercase mb-5">Wind</h6>
                        <p class="fs-1 mb-0" id="wind">14 km/h</p>
                    </div>
                </div>
                <div class="col-6 col-md-3 rounded-5">
                    <div class="card rounded-4 p-3 text-start precipitation-card">
                        <h6 class="text-uppercase mb-5">Precipitation</h6>
                        <p class="fs-1 mb-0" id="precipitation">0 mm</p>
                    </div>
                </div>
            </div>

        </main>

    </div>
    <!-- Script -->
    <script src="script.js"></script>
    <!-- CDN Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</body>

</html>
